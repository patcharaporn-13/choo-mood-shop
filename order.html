<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อ | CHOCO MOOD</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .nav-links a[aria-current="page"] { border-color: var(--pink); }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .footer { margin-top: auto; }

  </style>
</head>
<body>
  <header class="header">
    <nav class="container nav">
      <a class="logo" href="index.html">CHOCO MOOD</a>
      <ul class="nav-links">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
        <li><a href="order.html" aria-current="page">สั่งซื้อ</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-title">
          <h1>สั่งซื้อสินค้า</h1>
          <p>กรอกข้อมูลให้ครบ แล้วกดยืนยันสั่งซื้อ</p>
        </div>
        <form id="orderForm" class="form">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" placeholder="เช่น 0812345678 หรือ Line ID" required>
          </div>
          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" placeholder="เช่น Creamy Milk Chocolate 80g" required></textarea>
          </div>
          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>
          <div class="field">
            <label for="note">หมายเหตุ (ถ้ามี)</label>
            <textarea id="note" name="note"></textarea>
          </div>
          <button type="submit" class="btn btn--block">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="logo">CHOCO MOOD</p>
    <p>Bite Your Mood, Sweeten Your Day</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
